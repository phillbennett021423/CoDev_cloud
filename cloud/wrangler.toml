# CoDev's online server. The "Deploy CoDev server" GitHub workflow fills in
# database_id and sets the secrets, so nothing private is kept in this file.
name = "codev-cloud"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "codev-cloud"
database_id = "REPLACED_BY_DEPLOY_WORKFLOW"
migrations_dir = "migrations"

[observability]
enabled = true
