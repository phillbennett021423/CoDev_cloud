name: Deploy CoDev server

# Puts cloud/ (accounts, plans and the shared API keys) online as a Cloudflare
# Worker with a D1 database. Run it from Actions > Deploy CoDev server > Run
# workflow; after the first run it also redeploys when cloud/ changes on main.
# Needs these repository secrets (cloud/README.md says where each comes from):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CODEV_OWNER_EMAIL, RESEND_API_KEY
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloud/**
      - .github/workflows/deploy-server.yml

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the server
        working-directory: cloud
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OWNER_EMAIL: ${{ secrets.CODEV_OWNER_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      WRANGLER: npx --yes wrangler@4.148.0
    steps:
      - name: Check the secrets are set
        id: ready
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OWNER_EMAIL RESEND_API_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not deployed: these repository secrets aren't set yet:$missing (see cloud/README.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            # A manual run should fail loudly; a push just skips.
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && exit 1
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Find or create the database
        if: steps.ready.outputs.ok == 'true'
        working-directory: cloud
        run: |
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "codev-cloud") | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create codev-cloud
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "codev-cloud") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::Couldn't find or create the codev-cloud database."; exit 1; }
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$id/" wrangler.toml

      - name: Update the database tables
        if: steps.ready.outputs.ok == 'true'
        working-directory: cloud
        run: $WRANGLER d1 migrations apply codev-cloud --remote

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        id: deploy
        working-directory: cloud
        run: |
          $WRANGLER deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set the server's secrets
        if: steps.ready.outputs.ok == 'true'
        working-directory: cloud
        run: |
          # KEYS_SECRET locks the stored API keys. It's made once, on the first deploy,
          # and never shown; making a new one would make the stored keys unreadable.
          have_keys_secret=$($WRANGLER secret list --format json | jq -r '.[] | select(.name == "KEYS_SECRET") | .name')
          umask 077
          if [ -z "$have_keys_secret" ]; then
            jq -n --arg owner "$OWNER_EMAIL" --arg resend "$RESEND_API_KEY" --arg keys "$(openssl rand -base64 48)" \
              '{OWNER_EMAIL: $owner, RESEND_API_KEY: $resend, KEYS_SECRET: $keys}' > secrets.json
          else
            jq -n --arg owner "$OWNER_EMAIL" --arg resend "$RESEND_API_KEY" \
              '{OWNER_EMAIL: $owner, RESEND_API_KEY: $resend}' > secrets.json
          fi
          $WRANGLER secret bulk secrets.json
          rm -f secrets.json

      - name: Say where the server is
        if: steps.ready.outputs.ok == 'true'
        run: |
          echo "CoDev's server is online at ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Paste that address into CoDev under Settings > Sign in to CoDev > Server address." >> "$GITHUB_STEP_SUMMARY"
