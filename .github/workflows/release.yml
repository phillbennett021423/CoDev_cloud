name: Release APK and desktop app

# A merged pull request lands on main as a push, so this covers both cases.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Copy web app into the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Use CoDev's signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Without the secrets the APK is signed with a throwaway key, as before.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK won't install over the last one."; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/codev.keystore"
          echo "CODEV_KEYSTORE_FILE=$RUNNER_TEMP/codev.keystore" >> "$GITHUB_ENV"
          echo "CODEV_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CODEV_KEY_ALIAS=codev" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "release-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "CoDev Studio release ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}." \
            --draft

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" codev-studio.apk
          gh release upload "release-${{ github.run_number }}" "$APK" codev-studio.apk \
            --repo "${{ github.repository }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "release-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest

  desktop:
    # Adds the Windows installer to the release the job above just published.
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "release-${{ github.run_number }}" desktop/dist/CoDev-Studio-Setup.exe \
            --repo "${{ github.repository }}"
