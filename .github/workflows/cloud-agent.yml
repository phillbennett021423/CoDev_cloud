name: Cloud agents

# Runs CoDev's agents on GitHub's servers, so tasks keep going with the phone and PC off.
# CoDev queues a task on the agent-queue branch and starts this workflow; the hourly
# schedule picks up repeating tasks (and anything a busy moment missed). The first job
# only looks at the queue's timing, so an hour with nothing due costs a few seconds.
# See scripts/cloud-agent.js and the README's "Cloud agents" section.
#
# Secrets: CODEV_CLOUD_PASSPHRASE (the same passphrase as in CoDev's Settings) and the
# CODEV_SHARED_* provider keys the agents use (the same ones as the private build).
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

# One run at a time: a run started while another works waits, and that one picks up
# every task that is due, so nothing runs twice.
concurrency:
  group: cloud-agents
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.queue.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/cloud-agent.js
            mobile/www/agent-ui/cloud-queue.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cloud-agent.js --check

  run:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    # GitHub stops a job at 6 hours; the worker stops starting tasks at 5.5 and hands the rest to a new run.
    timeout-minutes: 355
    env:
      CODEV_SHARED_GROQ: ${{ secrets.CODEV_SHARED_GROQ }}
      CODEV_SHARED_OPENROUTER: ${{ secrets.CODEV_SHARED_OPENROUTER }}
      CODEV_SHARED_ANTHROPIC: ${{ secrets.CODEV_SHARED_ANTHROPIC }}
      CODEV_SHARED_GEMINI: ${{ secrets.CODEV_SHARED_GEMINI }}
      CODEV_SHARED_TAVILY: ${{ secrets.CODEV_SHARED_TAVILY }}
      CODEV_SHARED_AZURE_SPEECH: ${{ secrets.CODEV_SHARED_AZURE_SPEECH }}
      CODEV_SHARED_AZURE_SPEECH_REGION: ${{ secrets.CODEV_SHARED_AZURE_SPEECH_REGION }}
      CODEV_SHARED_ODDS: ${{ secrets.CODEV_SHARED_ODDS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install CoDev and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      # Into the runner's copy only; never committed.
      - name: Build the keys in
        run: node scripts/write-shared-keys.js

      - name: Run the due tasks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEV_CLOUD_PASSPHRASE: ${{ secrets.CODEV_CLOUD_PASSPHRASE }}
        run: node scripts/cloud-agent.js
