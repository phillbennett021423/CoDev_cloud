name: Android debug APK

# Builds on every branch except main. Pushes to main (including merged pull
# requests) are built and published by release.yml.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Copy web app into the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Use CoDev's signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Without the secrets the APK is signed with a throwaway key, as before.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK won't install over the last one."; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/codev.keystore"
          echo "CODEV_KEYSTORE_FILE=$RUNNER_TEMP/codev.keystore" >> "$GITHUB_ENV"
          echo "CODEV_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CODEV_KEY_ALIAS=codev" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codev-studio-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

