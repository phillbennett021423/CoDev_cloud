<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Companion Preview</title>
  <link rel="stylesheet" href="companion.css">
  <style>
    body { font-family: system-ui, sans-serif; background: #161a22; color: #e6e9ef; margin: 0; padding: 24px 16px; }
    h2 { font-size: 15px; margin: 18px 0 8px; color: #9fb3c8; }
    .wrap { max-width: 760px; margin: 0 auto; }
    .stage-box { background: #0f131a; border-radius: 16px; padding: 12px; }
    #label { text-align: center; margin-top: 10px; font-weight: 600; }
    .grid { display: flex; flex-wrap: wrap; gap: 6px; }
    button { background: #222a36; color: #e6e9ef; border: 1px solid #334055; border-radius: 8px; padding: 6px 9px; cursor: pointer; font-size: 12px; }
    button:hover { background: #2c3749; }
    .cat-active { border-left: 3px solid #4cc9f0; padding-left: 6px; }
    .cat-processing { border-left: 3px solid #b388ff; padding-left: 6px; }
    .cat-system { border-left: 3px solid #ff6b6b; padding-left: 6px; }
    .cat-idle { border-left: 3px solid #06d6a0; padding-left: 6px; }
    .note { color: #8a97a8; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage-box">
      <div class="companion-stage" id="stage">
        <div class="companion-body" id="body">
        </div>
        <div class="companion-fx" id="fx"></div>
      </div>
      <div id="label" aria-live="polite">Resting</div>
    </div>

    <h2>Avatar</h2>
    <div class="grid" id="avatars"></div>

    <h2>Play each animation (preview)</h2>
    <div id="anims"></div>

    <h2>Simulate system events</h2>
    <div class="grid" id="events"></div>

    <h2>Controls</h2>
    <div class="grid">
      <button type="button" id="stop">Stop and return to idle timer</button>
    </div>
    <p class="note">Manual play overrides everything. Idle loops start after 2 minutes with no events and only run when nothing else is active. Start and end events are counted, so two <code>search.start</code> clicks need two <code>search.end</code> clicks.</p>
  </div>

  <script src="companion.js"></script>
  <script>
    (function () {
      var C = window.VortexCompanion;
      C.init({
        stage: document.getElementById('stage'),
        body: document.getElementById('body'),
        fx: document.getElementById('fx'),
        label: document.getElementById('label')
      });

      // The same pictures the app offers (companion-bridge.js), shown at preview size.
      var AVATARS = [
        { name: 'Bear hoodie duo', images: ['avatars/bear-wink.png', 'avatars/bear-smile.png'] },
        { name: 'Bear hoodie (wink)', images: ['avatars/bear-wink.png'] },
        { name: 'Bear hoodie (smile)', images: ['avatars/bear-smile.png'] },
        { name: 'Robot', images: ['avatar.svg'] }
      ];
      function show(a) {
        var body = document.getElementById('body');
        body.innerHTML = '';
        a.images.forEach(function (src) {
          var img = document.createElement('img');
          img.className = 'companion-img';
          img.alt = a.name;
          img.src = src;
          body.appendChild(img);
        });
      }
      var avBox = document.getElementById('avatars');
      AVATARS.forEach(function (a) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = a.name;
        b.addEventListener('click', function () { show(a); });
        avBox.appendChild(b);
      });
      show(AVATARS[0]);

      var groups = { active: 'Active work', processing: 'Processing', system: 'System states', idle: 'Personality idles' };
      var animBox = document.getElementById('anims');
      Object.keys(groups).forEach(function (cat) {
        var wrap = document.createElement('div');
        wrap.className = 'cat-' + cat;
        wrap.style.marginBottom = '8px';
        var title = document.createElement('div');
        title.className = 'note';
        title.textContent = groups[cat];
        wrap.appendChild(title);
        var row = document.createElement('div');
        row.className = 'grid';
        C.animations.filter(function (a) { return a.category === cat; }).forEach(function (a) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = a.id + '. ' + a.name;
          b.addEventListener('click', function () { C.play(a.id); });
          row.appendChild(b);
        });
        wrap.appendChild(row);
        animBox.appendChild(wrap);
      });

      var evBox = document.getElementById('events');
      C.events.forEach(function (name) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = name;
        b.addEventListener('click', function () { C.notify(name); });
        evBox.appendChild(b);
      });

      document.getElementById('stop').addEventListener('click', function () { C.stop(); });
    })();
  </script>
</body>
</html>
